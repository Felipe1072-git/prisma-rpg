site_name: Prisma RPG
site_description: Sistema de RPG de mesa homebrew autoral — d20 simplificado, sem classes
site_author: Paulo Souza
site_url: https://felipe1072-git.github.io/prisma-rpg/
repo_url: https://github.com/Felipe1072-git/prisma-rpg
repo_name: Felipe1072-git/prisma-rpg
copyright: >
  Prisma RPG © Paulo Souza —
  <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" rel="license">CC BY 4.0</a>.
  Use, copie e adapte livremente, creditando o autor.

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Modo escuro
  font:
    text: Crimson Pro
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tables
    - toc.follow

plugins:
  - search:
      lang: pt

hooks:
  - hooks/prisma.py

extra_css:
  - assets/css/prisma.css

extra_javascript:
  - assets/js/prisma.js

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - admonition
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Início: index.md
  - Livro do Jogador:
    - Introdução: jogador/introducao.md
    - O Sistema d20: jogador/sistema-d20.md
    - Mana: jogador/mana.md
    - Pontos de Ação: jogador/pontos-de-acao.md
    - Origem: jogador/origem.md
    - Tocado: jogador/tocado.md
    - Arsenal: jogador/arsenal.md
  - Habilidades:
    - Visão Geral: habilidades/index.md
    - Marciais: habilidades/marciais.md
    - Pontaria: habilidades/pontaria.md
    - Mágicas Básicas: habilidades/magicas-basicas.md
    - Mágicas por Elemento: habilidades/magicas-elementais.md
    - Sociais: habilidades/sociais.md
    - Infiltração: habilidades/infiltracao.md
    - Mobilidade: habilidades/mobilidade.md
    - Buff: habilidades/buff.md
    - Debuff: habilidades/debuff.md
    - Suporte: habilidades/suporte.md
  - Pacotes: pacotes/index.md
  - Raças: racas/index.md
  - Livro do Mestre:
    - Visão Geral: mestre/index.md
    - Bestiário: mestre/bestiario.md
    - Montagem de Encontro: mestre/encontros.md
    - Testes e Dificuldades: mestre/testes.md
    - Recompensas: mestre/recompensas.md
    - Exploração: mestre/exploracao.md
  - Glossário: glossario.md
