site_name: Prisma RPG
site_description: Sistema de RPG de mesa homebrew autoral — d20 simplificado, sem classes
site_author: Paulo Souza
site_url: https://felipe1072-git.github.io/prisma-rpg/
repo_url: https://github.com/Felipe1072-git/prisma-rpg
repo_name: Felipe1072-git/prisma-rpg
copyright: >
  Prisma RPG © Paulo Souza —
  <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" rel="license">CC BY 4.0</a>.
  Use, copie e adapte livremente, creditando o autor.

theme:
  name: material
  language: pt-BR
  favicon: assets/img/favicon.png
  logo: assets/img/favicon.png
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Modo escuro
  font:
    text: Crimson Pro
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tables
    - content.tooltips
    - toc.follow

plugins:
  - search:
      lang: pt

hooks:
  - hooks/prisma.py

extra_css:
  - assets/css/prisma.css
  - assets/css/ficha.css
  - assets/vendor/leaflet/leaflet.css

extra_javascript:
  - assets/js/prisma.js
  - assets/vendor/leaflet/leaflet.js
  - assets/js/mapa-dados.js
  - assets/js/mapa.js

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - admonition
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Início: index.md
  - Mundo:
    - mundo/index.md
    - Mapa de Pania: mundo/mapa.md
  - Jogando o Jogo:
    - jogar/index.md
    - Os Oito Atributos: jogar/atributos.md
    - Testes de d20: jogar/testes.md
    - Combate: jogar/combate.md
    - Mana: jogar/mana.md
    - Dano e Cura: jogar/dano-e-cura.md
    - Condições: jogar/condicoes.md
    - Estresse: jogar/estresse.md
    - Exploração: jogar/exploracao.md
  - Criação de Personagem:
    - criacao/index.md
    - Progressão de Nível: criacao/progressao.md
    - Tocado: criacao/tocado.md
  - Ficha de Personagem: ficha.md
  - Compêndio:
    - compendio/index.md
    - Habilidades: habilidades/index.md
    - Regras de Habilidade: habilidades/regras.md
    - Raças: racas/index.md
    - Origens: origens/index.md
    - Equipamento: equipamento/index.md
    - Regras de Equipamento: equipamento/regras.md
    - Pacotes: pacotes/index.md
    - Sorteio de Pacote: pacotes/sorteio.md
  - Bestiário: bestiario/index.md
  - Livro do Mestre:
    - mestre/index.md
    - Criaturas:
      - Criando uma Criatura: mestre/criando-criaturas.md
      - Montagem de Encontro: mestre/encontros.md
    - Conduzindo a Mesa:
      - Testes e Dificuldades: mestre/testes.md
      - Exploração na Mesa: mestre/exploracao.md
      - Recompensas: mestre/recompensas.md
  - Glossário: glossario.md
